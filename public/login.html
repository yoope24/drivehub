<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveHub - Sign In | Modern Cloud Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-bg-glow"></div>

  <div class="login-card shadow-lg">
    <!-- Header Brand -->
    <div class="login-brand-header text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center mb-3">
        <img src="images/essu_logo.png" alt="ESSU Logo" style="width: 88px; height: 88px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.18));">
      </div>
      <h3 class="fw-bold text-dark mb-1">DriveHub Extension</h3>
      <p class="text-muted small mb-0">ESSU Cloud File & Workspace Management</p>
    </div>

    <!-- Alert Box -->
    <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

    <!-- Production Sign In Form -->
    <form id="loginForm" autocomplete="on">
      <div class="mb-3">
        <label for="loginUsername" class="form-label small fw-bold text-secondary">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-fill"></i></span>
          <input type="text" class="form-control border-start-0 ps-0" id="loginUsername" placeholder="Enter your username" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="loginPassword" class="form-label small fw-bold text-secondary mb-0">Password</label>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
          <button class="btn btn-outline-secondary border-start-0 bg-light text-muted" type="button" id="togglePasswordBtn" title="Toggle password visibility">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small text-muted" for="rememberMe">
            Remember this device
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-2" id="submitLoginBtn" style="background: #4f46e5; border-color: #4f46e5;">
        <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Workspace
      </button>

      <button type="button" class="btn btn-create-account w-100 py-2 fw-semibold shadow-sm" id="btnCreateAccount" data-bs-toggle="modal" data-bs-target="#registerModal">
        <i class="bi bi-person-plus-fill me-2"></i> Create Account
      </button>
    </form>

    <!-- Professional Workspace Footer -->
    <div class="mt-4 pt-3 border-top text-center">
      <p class="text-muted small mb-2">
        <i class="bi bi-shield-lock-fill text-success me-1"></i> Authorized Extension Personnel Only.
      </p>
      <div class="text-muted" style="font-size: 0.76rem;">
        Need assistance or access credentials? Contact TESO.
      </div>
    </div>
  </div>

  <!-- Registration Modal -->
  <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
        <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
          <div class="d-flex align-items-center gap-3">
            <div class="rounded-3 p-2 text-white shadow-sm" style="background: #22c55e;">
              <i class="bi bi-person-plus-fill fs-4"></i>
            </div>
            <div>
              <h5 class="modal-title fw-bold text-dark mb-0" id="registerModalLabel">Create Account</h5>
              <p class="text-muted small mb-0">Join DriveHub Workspace</p>
            </div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div id="registerAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

          <form id="registerForm" autocomplete="on">
            <div class="mb-3">
              <label for="regFullName" class="form-label small fw-bold text-secondary">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-badge"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="regFullName" placeholder="e.g. Alex Johnson" required autocomplete="name">
              </div>
            </div>

            <div class="mb-3">
              <label for="regUsername" class="form-label small fw-bold text-secondary">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-at"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="regUsername" placeholder="e.g. alexj" required autocomplete="username">
              </div>
            </div>

            <div class="mb-3">
              <label for="regPassword" class="form-label small fw-bold text-secondary">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="regPassword" placeholder="Minimum 4 characters" minlength="4" required autocomplete="new-password">
              </div>
            </div>

            <div class="mb-4">
              <label for="regConfirmPassword" class="form-label small fw-bold text-secondary">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="regConfirmPassword" placeholder="Re-type your password" minlength="4" required autocomplete="new-password">
              </div>
            </div>

            <button type="submit" class="btn btn-create-account w-100 py-2 fw-semibold shadow-sm" id="submitRegisterBtn">
              <i class="bi bi-check-circle-fill me-2"></i> Register & Enter Workspace
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Check if already authenticated
    (async function checkExistingAuth() {
      const token = localStorage.getItem('drivehub_token');
      if (token) {
        try {
          const res = await API.getMe();
          if (res && res.user) {
            window.location.href = '/index.html';
          }
        } catch (e) {
          localStorage.removeItem('drivehub_token');
          localStorage.removeItem('drivehub_user');
        }
      }
    })();

    // Password visibility toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const loginPassword = document.getElementById('loginPassword');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
      loginPassword.setAttribute('type', type);
      togglePasswordIcon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    });

    // Alert helper
    const alertBox = document.getElementById('loginAlert');
    function showAlert(msg, type = 'danger') {
      alertBox.className = `alert alert-${type} py-2 px-3 small rounded-3`;
      alertBox.textContent = msg;
      alertBox.classList.remove('d-none');
    }
    function hideAlert() {
      alertBox.classList.add('d-none');
    }

    // Handle Login submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const submitBtn = document.getElementById('submitLoginBtn');
      const originalText = submitBtn.innerHTML;

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        await API.login(username, password);
        window.location.href = '/index.html';
      } catch (err) {
        showAlert(err.message || 'Invalid username or password.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });

    // Handle Registration submission
    const regAlertBox = document.getElementById('registerAlert');
    function showRegAlert(msg, type = 'danger') {
      regAlertBox.className = `alert alert-${type} py-2 px-3 small rounded-3`;
      regAlertBox.textContent = msg;
      regAlertBox.classList.remove('d-none');
    }
    function hideRegAlert() {
      regAlertBox.classList.add('d-none');
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideRegAlert();

      const fullName = document.getElementById('regFullName').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const submitBtn = document.getElementById('submitRegisterBtn');
      const originalText = submitBtn.innerHTML;

      if (password !== confirmPassword) {
        showRegAlert('Passwords do not match. Please verify and re-type.');
        return;
      }

      if (password.length < 4) {
        showRegAlert('Password must be at least 4 characters long.');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

        await API.register({
          full_name: fullName,
          username: username,
          password: password
        });

        // Redirect directly to dashboard upon successful registration
        window.location.href = '/index.html';
      } catch (err) {
        showRegAlert(err.message || 'Failed to create account. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
